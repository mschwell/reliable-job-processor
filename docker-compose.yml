services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_local_only
      POSTGRES_DB: reliable_jobs
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d reliable_jobs"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      ConnectionStrings__Jobs: "Host=db;Port=5432;Database=reliable_jobs;Username=demo;Password=demo_local_only"
      Worker__Enabled: "true"
    ports:
      - "127.0.0.1:5081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
